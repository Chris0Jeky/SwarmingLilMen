name: Scientific parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scientific-parity.yml'
      - '.github/scripts/scientific_parity.py'
      - '.github/scripts/test_scientific_parity.py'

permissions:
  contents: read

jobs:
  matrix:
    name: Full matrix (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [verify, alignment-off]
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Test scientific gate classification
        run: python -m unittest discover -s .github/scripts -p test_scientific_parity.py -v
      - name: Build parity harness
        run: dotnet build SwarmSim.Parity/SwarmSim.Parity.csproj -c Release
      - name: Run complete scientific matrix
        run: python .github/scripts/scientific_parity.py --mode ${{ matrix.mode }} --out artifacts/parity-${{ matrix.mode }}
      - name: Retain matrix, runtime provenance, logs and gate receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scientific-parity-${{ matrix.os }}-${{ matrix.mode }}
          path: artifacts/parity-${{ matrix.mode }}/
          if-no-files-found: warn
          retention-days: 14
