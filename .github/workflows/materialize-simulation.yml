name: Materialize reviewed simulation bundle
on:
  push:
    branches:
      - simulations/firefly-synchrony
      - simulations/turing-morphogenesis
      - simulations/avalanche-lab
      - simulations/ecogenesis
      - simulations/civitas
    paths:
      - '.demo-import/**'
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'Chris0Jeky/SwarmingLilMen'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Validate and unpack reviewed source without executing it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, json, lzma, hashlib
          expected = {
            'firefly-synchrony': (4, '85e229ffcc907c8d554cfc77c9ac71804409019818d95a99168a9adeeb679149'),
            'turing-morphogenesis': (5, 'f9670733d22890ee4a4193c92ac3741ae24b1fbf409f08b80fc21e6c837d8795'),
            'avalanche-lab': (5, '83be13a6d44ec8262abee7d42a96c893822935bc42dd216c3f502a681b8b0b7b'),
            'ecogenesis': (8, 'a3ba6974c24c35bfc08bc76712831184a6c6f215fa1bbf727146d7a1c333cac3'),
            'civitas': (11, '9f970504758dc5c0bf26412bc923610a1a2507049544ff7b4b1257b5ce4e04c0'),
          }
          ref = os.environ['GITHUB_REF_NAME']
          assert ref.startswith('simulations/'), 'Unexpected branch'
          slug = ref.removeprefix('simulations/')
          count, digest = expected[slug]
          parts = [Path(f'.demo-import/{slug}/part-{i:03d}.bin') for i in range(count)]
          assert all(p.is_file() and not p.is_symlink() and p.stat().st_size <= 6000 for p in parts)
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == digest, 'Transport checksum mismatch'
          dec = lzma.LZMADecompressor(memlimit=134217728)
          raw = dec.decompress(data, max_length=1000001)
          assert len(raw) <= 1000000 and dec.eof and not dec.unused_data, 'Invalid capsule size'
          payload = json.loads(raw)
          assert payload['schema'] == 1 and payload['slug'] == slug
          files = payload['files']
          assert 1 <= len(files) <= 100
          pending = {}; total = 0
          for f in files:
              path = PurePosixPath(f['path'])
              assert not path.is_absolute() and '..' not in path.parts and '\\' not in f['path']
              assert str(path).startswith(f'js-demos/{slug}/') and str(path) not in pending
              target = Path(str(path))
              assert not target.exists() and not target.is_symlink(), 'Existing file would be overwritten'
              assert not any(p.is_symlink() for p in target.parents), 'Symlink parent'
              content = f['content'].encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == f['sha256'], 'Source checksum mismatch'
              total += len(content); assert total <= 900000
              pending[str(path)] = content
          for name, ak, ek in [('js-demos/README.md', 'indexAnchor', 'indexEntry'), ('PROJECT_STATUS.md', 'statusAnchor', 'statusEntry')]:
              text = Path(name).read_text(encoding='utf-8')
              anchor = payload[ak]; entry = payload[ek]
              assert text.count(anchor) == 1, f'Ambiguous documentation anchor: {name}'
              text = text.replace(anchor, entry + anchor, 1)
              if name == 'js-demos/README.md' and payload.get('checkOff'):
                  old, new = payload['checkOff']
                  assert text.count(old) == 1
                  text = text.replace(old, new, 1)
              pending[name] = text.encode('utf-8')
          for name, content in pending.items():
              path = Path(name); path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(content)
          print(f'Validated and materialized {len(files)} source files for {slug}. No imported code was executed.')
          PY
      - name: Commit only the simulation package and its two index entries
        shell: bash
        run: |
          slug="${GITHUB_REF_NAME#simulations/}"
          case "$slug" in firefly-synchrony|turing-morphogenesis|avalanche-lab|ecogenesis|civitas) ;; *) exit 1 ;; esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "js-demos/$slug" js-demos/README.md PROJECT_STATUS.md
          git diff --cached --check
          git commit -m "feat(demos): add $slug implementation and integration notes"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
