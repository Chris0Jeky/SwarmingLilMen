name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwarmingLilMen.sln

      - name: Build (Release)
        run: dotnet build SwarmingLilMen.sln --configuration Release --no-restore

      - name: Test (Release, excluding performance tests)
        run: dotnet test SwarmingLilMen.sln --configuration Release --no-build --filter "FullyQualifiedName!~PerformanceTests"
