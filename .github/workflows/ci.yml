name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwarmingLilMen.sln

      - name: Build (Release)
        run: dotnet build SwarmingLilMen.sln --configuration Release --no-restore

      - name: Record deterministic reference traces
        run: dotnet test SwarmSim.Tests/SwarmSim.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GoldenTraceTests" --logger "console;verbosity=detailed" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test (Release, excluding performance tests)
        run: dotnet test SwarmingLilMen.sln --configuration Release --no-build --filter "Category!=Performance" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Verify headless artifacts and manifest replay
        run: python .github/scripts/smoke_headless.py

      - name: Probe native renderer (Mesa and Xvfb)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a dotnet run --project tools/RendererProbe -c Release --no-build -- artifacts/renderer-probe/ci

      - name: Retain renderer feedback
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: renderer-probe-integration
          path: artifacts/renderer-probe/ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Run behaviour gallery
        run: dotnet run --project SwarmSim.Cli -c Release --no-build -- --gallery scenarios/gallery.json --out artifacts/gallery

      - name: Retain behaviour gallery
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: behaviour-gallery-integration-${{ matrix.os }}
          path: artifacts/gallery/
          if-no-files-found: warn
          retention-days: 7

  exact-head:
    # Keep the merge-ref integration gate above and independently prove the reviewed commit.
    name: Exact head (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SwarmingLilMen.sln
      - name: Build (Release)
        run: dotnet build SwarmingLilMen.sln --configuration Release --no-restore

      - name: Record deterministic reference traces
        run: dotnet test SwarmSim.Tests/SwarmSim.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GoldenTraceTests" --logger "console;verbosity=detailed" -- RunConfiguration.TreatNoTestsAsError=true
      - name: Test reviewed head
        run: dotnet test SwarmingLilMen.sln --configuration Release --no-build --filter "Category!=Performance" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Verify headless artifacts and manifest replay
        run: python .github/scripts/smoke_headless.py

      - name: Probe native renderer (Mesa and Xvfb)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a dotnet run --project tools/RendererProbe -c Release --no-build -- artifacts/renderer-probe/ci

      - name: Retain renderer feedback
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: renderer-probe-exact-head
          path: artifacts/renderer-probe/ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Run behaviour gallery
        run: dotnet run --project SwarmSim.Cli -c Release --no-build -- --gallery scenarios/gallery.json --out artifacts/gallery

      - name: Retain behaviour gallery
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: behaviour-gallery-exact-head-${{ matrix.os }}
          path: artifacts/gallery/
          if-no-files-found: warn
          retention-days: 7
