name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwarmingLilMen.sln

      - name: Build (Release)
        run: dotnet build SwarmingLilMen.sln --configuration Release --no-restore

      - name: Record deterministic reference traces
        run: dotnet test SwarmSim.Tests/SwarmSim.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GoldenTraceTests" --logger "console;verbosity=detailed" -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test (Release, excluding performance tests)
        run: dotnet test SwarmingLilMen.sln --configuration Release --no-build --filter "Category!=Performance" -- RunConfiguration.TreatNoTestsAsError=true

  exact-head:
    # Keep the merge-ref integration gate above and independently prove the reviewed commit.
    name: Exact head (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SwarmingLilMen.sln
      - name: Build (Release)
        run: dotnet build SwarmingLilMen.sln --configuration Release --no-restore

      - name: Record deterministic reference traces
        run: dotnet test SwarmSim.Tests/SwarmSim.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GoldenTraceTests" --logger "console;verbosity=detailed" -- RunConfiguration.TreatNoTestsAsError=true
      - name: Test reviewed head
        run: dotnet test SwarmingLilMen.sln --configuration Release --no-build --filter "Category!=Performance" -- RunConfiguration.TreatNoTestsAsError=true
